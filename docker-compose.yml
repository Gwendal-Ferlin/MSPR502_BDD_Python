# TrueNAS / serveur : bases vides, pas de montage init (évite Permission denied sur ZFS).
# Profils Compose : complete | offline | performance
#   cp .env.complete.example .env && docker compose --profile complete up -d --build
#   cp .env.offline.example .env  && docker compose --profile offline up -d --build
#   cp .env.performance.example .env && docker compose -f docker-compose.performance.server.override.yml --profile performance up -d --build
#
# Après "docker compose up", initialiser les BDD à la main (voir README) :
#
# 1) Postgres utilisateur (schéma + seed si besoin) :
#   docker cp init/postgres-utilisateur/01_schema.sql postgres-utilisateur:/tmp/
#   docker exec postgres-utilisateur psql -U utilisateur_user -d utilisateur_db -f /tmp/01_schema.sql
#   docker cp init/postgres-utilisateur/02_seed.sql postgres-utilisateur:/tmp/
#   docker exec postgres-utilisateur psql -U utilisateur_user -d utilisateur_db -f /tmp/02_seed.sql
#
# 2) Postgres santé (schéma + seed si besoin) :
#   docker cp init/postgres-sante/01_schema.sql postgres-sante:/tmp/
#   docker exec postgres-sante psql -U sante_user -d sante_db -f /tmp/01_schema.sql
#   docker cp init/postgres-sante/02_seed.sql postgres-sante:/tmp/
#   docker exec postgres-sante psql -U sante_user -d sante_db -f /tmp/02_seed.sql
#   docker cp init/postgres-sante/09_seed_seances_performance.sql postgres-sante:/tmp/
#   docker exec postgres-sante psql -U sante_user -d sante_db -f /tmp/09_seed_seances_performance.sql
#
# 3) Postgres gamification (schéma + seed si besoin) :
#   docker cp init/postgres-gamification/01_schema.sql postgres-gamification:/tmp/
#   docker exec postgres-gamification psql -U gamification_user -d gamification_db -f /tmp/01_schema.sql
#   docker cp init/postgres-gamification/02_seed.sql postgres-gamification:/tmp/
#   docker exec postgres-gamification psql -U gamification_user -d gamification_db -f /tmp/02_seed.sql
#
# 4) MongoDB logs :
#   docker cp init/mongodb-logs/init.js mongodb-logs:/tmp/
#   docker exec mongodb-logs mongosh logs_config --file /tmp/init.js
#
# 5) MongoDB reco :
#   docker cp init/mongodb-reco/init.js mongodb-reco:/tmp/
#   docker exec mongodb-reco mongosh reco --file /tmp/init.js
#
# 6) Migration communauté (profil public, publications) — si BDD déjà initialisée :
#   docker cp init/postgres-utilisateur/08_migration_profil_public_social.sql postgres-utilisateur:/tmp/
#   docker exec postgres-utilisateur psql -U utilisateur_user -d utilisateur_db -f /tmp/08_migration_profil_public_social.sql
#
# MinIO : définir MINIO_PUBLIC_URL dans le .env (IP TrueNAS + port 19000), ex. :
#   MINIO_PUBLIC_URL=http://192.168.1.150:19000

services:
  postgres-utilisateur:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-utilisateur
    environment:
      POSTGRES_USER: ${POSTGRES_UTILISATEUR_USER:-utilisateur_user}
      POSTGRES_PASSWORD: ${POSTGRES_UTILISATEUR_PASSWORD:-utilisateur_password}
      POSTGRES_DB: utilisateur_db
    ports:
      - "15432:5432"
    volumes:
      - pg_utilisateur_data:/var/lib/postgresql/data
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d utilisateur_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-sante:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-sante
    environment:
      POSTGRES_USER: ${POSTGRES_SANTE_USER:-sante_user}
      POSTGRES_PASSWORD: ${POSTGRES_SANTE_PASSWORD:-sante_password}
      POSTGRES_DB: sante_db
    ports:
      - "15433:5432"
    volumes:
      - pg_sante_data:/var/lib/postgresql/data
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sante_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-gamification:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-gamification
    environment:
      POSTGRES_USER: ${POSTGRES_GAMIFICATION_USER:-gamification_user}
      POSTGRES_PASSWORD: ${POSTGRES_GAMIFICATION_PASSWORD:-gamification_password}
      POSTGRES_DB: gamification_db
    ports:
      - "15434:5432"
    volumes:
      - pg_gamification_data:/var/lib/postgresql/data
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d gamification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb-logs:
    profiles: [complete, offline, performance]
    image: mongo:7
    container_name: mongodb-logs
    environment:
      MONGO_INITDB_DATABASE: logs_config
    ports:
      - "27017:27017"
    volumes:
      - mongo_logs_data:/data/db
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-reco:
    profiles: [complete, offline, performance]
    image: mongo:7
    container_name: mongodb-reco
    environment:
      MONGO_INITDB_DATABASE: reco
    ports:
      - "27018:27017"
    volumes:
      - mongo_reco_data:/data/db
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: [complete, offline]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "19000:9000"
      - "19001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mspr502-network
    restart: unless-stopped

  api:
    profiles: [complete, offline, performance]
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    ports:
      - "18000:8000"
    env_file:
      - .env
    environment:
      APP_PROFILE: ${APP_PROFILE:-complete}
      IA_MOCK_MODE: ${IA_MOCK_MODE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      POSTGRES_UTILISATEUR_HOST: postgres-utilisateur
      POSTGRES_UTILISATEUR_PORT: "5432"
      POSTGRES_UTILISATEUR_USER: ${POSTGRES_UTILISATEUR_USER:-utilisateur_user}
      POSTGRES_UTILISATEUR_PASSWORD: ${POSTGRES_UTILISATEUR_PASSWORD:-utilisateur_password}
      POSTGRES_SANTE_HOST: postgres-sante
      POSTGRES_SANTE_PORT: "5432"
      POSTGRES_SANTE_USER: ${POSTGRES_SANTE_USER:-sante_user}
      POSTGRES_SANTE_PASSWORD: ${POSTGRES_SANTE_PASSWORD:-sante_password}
      POSTGRES_GAMIFICATION_HOST: postgres-gamification
      POSTGRES_GAMIFICATION_PORT: "5432"
      POSTGRES_GAMIFICATION_USER: ${POSTGRES_GAMIFICATION_USER:-gamification_user}
      POSTGRES_GAMIFICATION_PASSWORD: ${POSTGRES_GAMIFICATION_PASSWORD:-gamification_password}
      MONGODB_LOGS_HOST: mongodb-logs
      MONGODB_LOGS_PORT: "27017"
      MONGODB_RECO_HOST: mongodb-reco
      MONGODB_RECO_PORT: "27017"
      JWT_SECRET: ${JWT_SECRET:-CHANGE_ME_JWT_SECRET}
      JWT_ALGORITHM: HS256
      JWT_EXPIRE_MINUTES: "60"
      DATA_ENCRYPTION_KEY: ${DATA_ENCRYPTION_KEY:-}
      HF_API_TOKEN: ${HF_API_TOKEN:-}
      HF_MODEL_ID: ${HF_MODEL_ID:-Qwen/Qwen2.5-7B-Instruct}
      HF_TIMEOUT_SEC: ${HF_TIMEOUT_SEC:-45}
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:19000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mspr502-medias}
    depends_on:
      postgres-utilisateur:
        condition: service_healthy
      postgres-sante:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      mongodb-logs:
        condition: service_healthy
      mongodb-reco:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
    networks:
      - mspr502-network

  backup:
    profiles: [complete, offline]
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: backup
    env_file:
      - .env
    environment:
      POSTGRES_UTILISATEUR_HOST: postgres-utilisateur
      POSTGRES_UTILISATEUR_PORT: 5432
      POSTGRES_UTILISATEUR_USER: ${POSTGRES_UTILISATEUR_USER:-utilisateur_user}
      POSTGRES_UTILISATEUR_PASSWORD: ${POSTGRES_UTILISATEUR_PASSWORD:-utilisateur_password}
      POSTGRES_SANTE_HOST: postgres-sante
      POSTGRES_SANTE_PORT: 5432
      POSTGRES_SANTE_USER: ${POSTGRES_SANTE_USER:-sante_user}
      POSTGRES_SANTE_PASSWORD: ${POSTGRES_SANTE_PASSWORD:-sante_password}
      POSTGRES_GAMIFICATION_HOST: postgres-gamification
      POSTGRES_GAMIFICATION_PORT: 5432
      POSTGRES_GAMIFICATION_USER: ${POSTGRES_GAMIFICATION_USER:-gamification_user}
      POSTGRES_GAMIFICATION_PASSWORD: ${POSTGRES_GAMIFICATION_PASSWORD:-gamification_password}
      MONGODB_LOGS_HOST: mongodb-logs
      MONGODB_LOGS_PORT: 27017
      MONGODB_RECO_HOST: mongodb-reco
      MONGODB_RECO_PORT: 27017
      BACKUP_OUT_DIR: /backups
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_PATH: ${RCLONE_PATH:-MSPR502/backups}
    volumes:
      - ./backups:/backups
      - ./rclone:/config:ro
    depends_on:
      postgres-utilisateur:
        condition: service_healthy
      postgres-sante:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      mongodb-logs:
        condition: service_healthy
      mongodb-reco:
        condition: service_healthy
    networks:
      - mspr502-network

  metabase:
    profiles: [complete]
    image: metabase/metabase:v0.52.8
    container_name: metabase
    ports:
      - "13000:3000"
    environment:
      MB_SITE_URL: ${METABASE_SITE_URL:-http://localhost:13000}
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres-sante:
        condition: service_healthy
      postgres-utilisateur:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      mongodb-logs:
        condition: service_healthy
      mongodb-reco:
        condition: service_healthy
    networks:
      - mspr502-network
    restart: unless-stopped

  prometheus:
    profiles: [complete]
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "19090:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mspr502-network
    restart: unless-stopped

  grafana:
    profiles: [complete]
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "13001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:13001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mspr502-network
    restart: unless-stopped

  # Logs dans etl/logs/ sur le dataset (creer le dossier avant le 1er run si absent : mkdir -p etl/logs).
  etl:
    build:
      context: etl
      dockerfile: Dockerfile
    container_name: etl
    profiles:
      - etl
    environment:
      DB_HOST: postgres-sante
      DB_PORT: "5432"
      DB_NAME: sante_db
      DB_USER: sante_user
      DB_PASSWORD: sante_password
    volumes:
      - ./etl/logs:/app/logs
    depends_on:
      postgres-sante:
        condition: service_healthy
    networks:
      - mspr502-network

networks:
  mspr502-network:
    driver: bridge

volumes:
  pg_utilisateur_data:
  pg_sante_data:
  pg_gamification_data:
  mongo_logs_data:
  mongo_reco_data:
  minio_data:
  metabase_data:
  prometheus_data:
  grafana_data:
