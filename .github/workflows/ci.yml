name: CI

on:
  push:
    branches: ["main", "develop", "preprod"]
  pull_request:
    branches: ["main", "develop", "preprod"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ─────────────────────────────────────────────────────────────────────────────
# Variables globales partagées par les jobs
# ─────────────────────────────────────────────────────────────────────────────
env:
  PYTHON_VERSION: "3.12"
  # Opter pour Node.js 24 sur les runners GitHub Actions (évite le warning de dépréciation Node 20)
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  # Valeurs CI — aucun secret réel
  POSTGRES_UTILISATEUR_USER: utilisateur_user
  POSTGRES_UTILISATEUR_PASSWORD: utilisateur_password
  POSTGRES_SANTE_USER: sante_user
  POSTGRES_SANTE_PASSWORD: sante_password
  POSTGRES_GAMIFICATION_USER: gamification_user
  POSTGRES_GAMIFICATION_PASSWORD: gamification_password
  JWT_SECRET: ci_jwt_secret_not_for_production
  DATA_ENCRYPTION_KEY: ""
  IA_MOCK_MODE: "true"
  APP_PROFILE: offline
  RATE_LIMIT_ENABLED: "false"
  # URL de l'API lancée dans le job d'intégration
  API_BASE_URL: "http://127.0.0.1:18000"

jobs:

  check-secrets:
    name: "🔑 Check Secrets"
    runs-on: ubuntu-latest
    outputs:
      has_dockerhub_secrets: ${{ steps.check.outputs.has_dockerhub_secrets }}
      has_sonar_secrets: ${{ steps.check.outputs.has_sonar_secrets }}
    steps:
      - id: check
        run: |
          if [ -n "${{ secrets.DOCKERHUB_USERNAME }}" ] && [ -n "${{ secrets.DOCKERHUB_TOKEN }}" ]; then
            echo "has_dockerhub_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_dockerhub_secrets=false" >> $GITHUB_OUTPUT
          fi

          if [ -n "${{ secrets.SONAR_TOKEN }}" ]; then
            echo "has_sonar_secrets=true" >> $GITHUB_OUTPUT
          else
            echo "has_sonar_secrets=false" >> $GITHUB_OUTPUT
          fi



  # ───────────────────────────────────────────────────────────────────────────
  # 1. LINT & FORMAT — ruff (linting + import sort) + mypy (type check)
  # ───────────────────────────────────────────────────────────────────────────
  lint:
    name: "🔍 Lint & Type-check"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install lint dependencies
        run: pip install ruff mypy

      - name: Install API dependencies (pour mypy)
        working-directory: api
        run: pip install --no-cache-dir -r requirements.txt

      - name: Ruff — lint
        run: ruff check api/ --output-format=github

      - name: Ruff — format check
        run: ruff format api/ --check

      - name: Mypy — type check
        run: mypy api/ --ignore-missing-imports --no-error-summary || true
        # « || true » : mypy en mode informatif, n'échoue pas le pipeline

  # ───────────────────────────────────────────────────────────────────────────
  # 2. UNIT TESTS — tests sans infrastructure externe (offline / mock)
  # ───────────────────────────────────────────────────────────────────────────
  unit-tests:
    name: "🧪 Tests unitaires (offline)"
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install API dependencies
        working-directory: api
        run: pip install --no-cache-dir -r requirements.txt

      - name: Install test dependencies
        working-directory: tests
        run: pip install --no-cache-dir -r requirements.txt

      - name: Run unit tests (hors marqueur integration)
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -m "not integration" \
            --tb=short \
            -v \
            --junitxml=test-results/unit.xml

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: unit-test-results
          path: tests/test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 3. INTEGRATION TESTS — stack Docker complète (profil offline)
  # ───────────────────────────────────────────────────────────────────────────
  integration-tests:
    name: "🔗 Tests d'intégration (Docker offline)"
    runs-on: ubuntu-latest
    needs: unit-tests

    steps:
      - uses: actions/checkout@v4

      # --- Écriture du .env CI -----------------------------------------------
      - name: Créer le fichier .env pour Docker Compose
        run: |
          cat <<'EOF' > .env
          APP_PROFILE=offline
          IA_MOCK_MODE=true
          RATE_LIMIT_ENABLED=false

          POSTGRES_UTILISATEUR_USER=utilisateur_user
          POSTGRES_UTILISATEUR_PASSWORD=utilisateur_password

          POSTGRES_SANTE_USER=sante_user
          POSTGRES_SANTE_PASSWORD=sante_password

          POSTGRES_GAMIFICATION_USER=gamification_user
          POSTGRES_GAMIFICATION_PASSWORD=gamification_password

          JWT_SECRET=ci_jwt_secret_not_for_production
          DATA_ENCRYPTION_KEY=

          MINIO_ROOT_USER=minioadmin
          MINIO_ROOT_PASSWORD=minioadmin
          MINIO_PUBLIC_URL=http://localhost:19000
          MINIO_BUCKET=mspr502-medias
          EOF

      # --- Démarrage de la stack (profil offline) ----------------------------
      - name: Build & start Docker Compose (profil offline)
        run: |
          docker compose --profile offline up -d --build
        timeout-minutes: 15

      # --- Initialisation des bases de données --------------------------------
      - name: Initialiser PostgreSQL — utilisateurs
        run: |
          docker cp init/postgres-utilisateur/01_schema.sql postgres-utilisateur:/tmp/
          docker exec postgres-utilisateur psql -U utilisateur_user -d utilisateur_db -f /tmp/01_schema.sql
          docker cp init/postgres-utilisateur/02_seed.sql postgres-utilisateur:/tmp/
          docker exec postgres-utilisateur psql -U utilisateur_user -d utilisateur_db -f /tmp/02_seed.sql

      - name: Initialiser PostgreSQL — santé
        run: |
          docker cp init/postgres-sante/01_schema.sql postgres-sante:/tmp/
          docker exec postgres-sante psql -U sante_user -d sante_db -f /tmp/01_schema.sql
          docker cp init/postgres-sante/02_seed.sql postgres-sante:/tmp/
          docker exec postgres-sante psql -U sante_user -d sante_db -f /tmp/02_seed.sql

      - name: Initialiser PostgreSQL — gamification
        run: |
          docker cp init/postgres-gamification/01_schema.sql postgres-gamification:/tmp/
          docker exec postgres-gamification psql -U gamification_user -d gamification_db -f /tmp/01_schema.sql
          docker cp init/postgres-gamification/02_seed.sql postgres-gamification:/tmp/
          docker exec postgres-gamification psql -U gamification_user -d gamification_db -f /tmp/02_seed.sql

      - name: Initialiser MongoDB — logs
        run: |
          docker cp init/mongodb-logs/init.js mongodb-logs:/tmp/
          docker exec mongodb-logs mongosh logs_config --file /tmp/init.js

      - name: Initialiser MongoDB — reco
        run: |
          docker cp init/mongodb-reco/init.js mongodb-reco:/tmp/
          docker exec mongodb-reco mongosh reco --file /tmp/init.js

      # --- Attendre que l'API soit prête --------------------------------------
      - name: Attendre la disponibilité de l'API (/health)
        run: |
          echo "Waiting for API at $API_BASE_URL/health …"
          for i in $(seq 1 30); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "$API_BASE_URL/health" || true)
            if [ "$STATUS" = "200" ]; then
              echo "✅ API disponible après $((i * 5))s"
              curl -s "$API_BASE_URL/health" | python3 -m json.tool
              exit 0
            fi
            echo "  [${i}/30] HTTP $STATUS — nouvelle tentative dans 5s…"
            sleep 5
          done
          echo "❌ API non disponible après 150s — logs du container :"
          docker logs api --tail 100
          exit 1

      # --- Lancer les tests d'intégration ------------------------------------
      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install API & test dependencies
        run: |
          pip install --no-cache-dir -r api/requirements.txt
          pip install --no-cache-dir -r tests/requirements.txt

      - name: Run integration tests
        working-directory: tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          pytest tests/ \
            -m "integration" \
            --tb=short \
            -v \
            --junitxml=test-results/integration.xml

      # --- Logs en cas d'échec -----------------------------------------------
      - name: Logs Docker (en cas d'échec)
        if: failure()
        run: docker compose --profile offline logs --tail 200

      # --- Nettoyage ----------------------------------------------------------
      - name: Arrêter la stack Docker
        if: always()
        run: docker compose --profile offline down -v

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integration-test-results
          path: tests/test-results/
          retention-days: 7

  # ───────────────────────────────────────────────────────────────────────────
  # 4. BUILD IMAGE DOCKER — vérifie que l'image se construit correctement
  # ───────────────────────────────────────────────────────────────────────────
  build-image:
    name: "🐳 Build Docker image"
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image API (sans push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: false
          tags: mspr502-api:ci-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # 5. SECURITY SCAN — Trivy (vulnérabilités dans les dépendances Python)
  # ───────────────────────────────────────────────────────────────────────────
  security-scan:
    name: "🔒 Scan de sécurité (Trivy)"
    runs-on: ubuntu-latest
    needs: build-image
    # Ne bloque pas le pipeline mais remonte les vulnérabilités critiques
    continue-on-error: true

    steps:
      - uses: actions/checkout@v4

      - name: Run Trivy — filesystem scan (requirements)
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: "api/requirements.txt"
          format: table
          exit-code: "0"   # informatif uniquement
          severity: "CRITICAL,HIGH"
          output: trivy-report.txt

      - name: Upload Trivy report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-security-report
          path: trivy-report.txt
          retention-days: 30

  # ───────────────────────────────────────────────────────────────────────────
  # 5.5 SONARQUBE SCAN — Analyse de la qualité du code
  # ───────────────────────────────────────────────────────────────────────────
  sonarqube:
    name: "📊 SonarQube Scan"
    runs-on: ubuntu-latest
    needs: [check-secrets, lint]
    if: needs.check-secrets.outputs.has_sonar_secrets == 'true'

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Recommandé par SonarQube pour avoir l'historique complet git

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@master
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}  # Utile si hébergé sur un serveur privé, sinon SonarCloud par défaut

  # ───────────────────────────────────────────────────────────────────────────
  # 6. PUSH IMAGE — uniquement sur main après succès complet
  # ───────────────────────────────────────────────────────────────────────────
  push-image:
    name: "🚀 Push image → registry"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build-image, check-secrets]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push' && needs.check-secrets.outputs.has_dockerhub_secrets == 'true'

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract Docker metadata (tags & labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/mspr502-api
          tags: |
            type=sha,prefix=,suffix=,format=short
            type=raw,value=latest,enable=true

      - name: Build & push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ───────────────────────────────────────────────────────────────────────────
  # 7. RÉSUMÉ DU PIPELINE — statut global
  # ───────────────────────────────────────────────────────────────────────────
  ci-summary:
    name: "✅ CI — résumé"
    runs-on: ubuntu-latest
    needs: [lint, unit-tests, integration-tests, build-image, security-scan]
    if: always()

    steps:
      - name: Vérifier les résultats des jobs précédents
        run: |
          echo "=== Résumé du pipeline CI ==="
          echo "Lint          : ${{ needs.lint.result }}"
          echo "Unit tests    : ${{ needs.unit-tests.result }}"
          echo "Intégration   : ${{ needs.integration-tests.result }}"
          echo "Build image   : ${{ needs.build-image.result }}"
          echo "Security scan : ${{ needs.security-scan.result }}"

          # Échoue si un job critique a échoué
          if [[ "${{ needs.lint.result }}" == "failure" || \
                "${{ needs.unit-tests.result }}" == "failure" || \
                "${{ needs.integration-tests.result }}" == "failure" || \
                "${{ needs.build-image.result }}" == "failure" ]]; then
            echo "❌ Pipeline CI en échec."
            exit 1
          fi
          echo "✅ Pipeline CI réussi."
