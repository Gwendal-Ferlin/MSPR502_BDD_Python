# Profils Compose : complete | offline | performance
# Démarrage : docker compose -f docker-compose-pc.yml --profile <profil> up -d --build
# Copier le .env du profil avant le lancement : cp .env.complete.example .env (ou offline / performance)

services:
  postgres-utilisateur:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-utilisateur
    environment:
      POSTGRES_USER: ${POSTGRES_UTILISATEUR_USER}
      POSTGRES_PASSWORD: ${POSTGRES_UTILISATEUR_PASSWORD}
      POSTGRES_DB: utilisateur_db
    ports:
      - "5432:5432"
    volumes:
      - pg_utilisateur_data:/var/lib/postgresql/data
      - ./init/postgres-utilisateur:/docker-entrypoint-initdb.d:ro
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d utilisateur_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-sante:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-sante
    environment:
      POSTGRES_USER: ${POSTGRES_SANTE_USER}
      POSTGRES_PASSWORD: ${POSTGRES_SANTE_PASSWORD}
      POSTGRES_DB: sante_db
    ports:
      - "5433:5432"
    volumes:
      - pg_sante_data:/var/lib/postgresql/data
      - ./init/postgres-sante:/docker-entrypoint-initdb.d:ro
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d sante_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  postgres-gamification:
    profiles: [complete, offline, performance]
    image: postgres:16-alpine
    container_name: postgres-gamification
    environment:
      POSTGRES_USER: ${POSTGRES_GAMIFICATION_USER}
      POSTGRES_PASSWORD: ${POSTGRES_GAMIFICATION_PASSWORD}
      POSTGRES_DB: gamification_db
    ports:
      - "5434:5432"
    volumes:
      - pg_gamification_data:/var/lib/postgresql/data
      - ./init/postgres-gamification:/docker-entrypoint-initdb.d:ro
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d gamification_db"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 30s

  mongodb-logs:
    profiles: [complete, offline, performance]
    image: mongo:7
    container_name: mongodb-logs
    environment:
      MONGO_INITDB_DATABASE: logs_config
    ports:
      - "27017:27017"
    volumes:
      - mongo_logs_data:/data/db
      - ./init/mongodb-logs:/docker-entrypoint-initdb.d:ro
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  mongodb-reco:
    profiles: [complete, offline, performance]
    image: mongo:7
    container_name: mongodb-reco
    environment:
      MONGO_INITDB_DATABASE: reco
    ports:
      - "27018:27017"
    volumes:
      - mongo_reco_data:/data/db
      - ./init/mongodb-reco:/docker-entrypoint-initdb.d:ro
    networks:
      - mspr502-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    profiles: [complete, offline]
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    networks:
      - mspr502-network

  api:
    profiles: [complete, offline, performance]
    build:
      context: .
      dockerfile: api/Dockerfile
    container_name: api
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_PROFILE: ${APP_PROFILE:-complete}
      IA_MOCK_MODE: ${IA_MOCK_MODE:-false}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      POSTGRES_UTILISATEUR_HOST: postgres-utilisateur
      POSTGRES_UTILISATEUR_PORT: 5432
      POSTGRES_SANTE_HOST: postgres-sante
      POSTGRES_SANTE_PORT: 5432
      POSTGRES_GAMIFICATION_HOST: postgres-gamification
      POSTGRES_GAMIFICATION_PORT: 5432
      MONGODB_LOGS_HOST: mongodb-logs
      MONGODB_LOGS_PORT: 27017
      MONGODB_RECO_HOST: mongodb-reco
      MONGODB_RECO_PORT: 27017
      MINIO_ENDPOINT: minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:-http://localhost:9000}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      MINIO_BUCKET: ${MINIO_BUCKET:-mspr502-medias}
    depends_on:
      postgres-utilisateur:
        condition: service_healthy
      postgres-sante:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      mongodb-logs:
        condition: service_healthy
      mongodb-reco:
        condition: service_healthy
      minio:
        condition: service_started
        required: false
    networks:
      - mspr502-network

  backup:
    profiles: [complete, offline]
    build:
      context: ./backup
      dockerfile: Dockerfile
    container_name: backup
    env_file:
      - .env
    environment:
      POSTGRES_UTILISATEUR_HOST: postgres-utilisateur
      POSTGRES_UTILISATEUR_PORT: 5432
      POSTGRES_UTILISATEUR_USER: ${POSTGRES_UTILISATEUR_USER}
      POSTGRES_UTILISATEUR_PASSWORD: ${POSTGRES_UTILISATEUR_PASSWORD}
      POSTGRES_SANTE_HOST: postgres-sante
      POSTGRES_SANTE_PORT: 5432
      POSTGRES_SANTE_USER: ${POSTGRES_SANTE_USER}
      POSTGRES_SANTE_PASSWORD: ${POSTGRES_SANTE_PASSWORD}
      POSTGRES_GAMIFICATION_HOST: postgres-gamification
      POSTGRES_GAMIFICATION_PORT: 5432
      POSTGRES_GAMIFICATION_USER: ${POSTGRES_GAMIFICATION_USER}
      POSTGRES_GAMIFICATION_PASSWORD: ${POSTGRES_GAMIFICATION_PASSWORD}
      MONGODB_LOGS_HOST: mongodb-logs
      MONGODB_LOGS_PORT: 27017
      MONGODB_RECO_HOST: mongodb-reco
      MONGODB_RECO_PORT: 27017
      BACKUP_OUT_DIR: /backups
      RCLONE_REMOTE: ${RCLONE_REMOTE:-}
      RCLONE_PATH: ${RCLONE_PATH:-MSPR502/backups}
    volumes:
      - ./backups:/backups
      - ./rclone:/config:ro
    depends_on:
      postgres-utilisateur:
        condition: service_healthy
      postgres-sante:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
      mongodb-logs:
        condition: service_healthy
      mongodb-reco:
        condition: service_healthy
    networks:
      - mspr502-network

  metabase:
    profiles: [complete]
    image: metabase/metabase:v0.49.8
    container_name: metabase
    ports:
      - "${METABASE_PORT:-3000}:3000"
    environment:
      MB_JETTY_HOST: 0.0.0.0
      MB_JETTY_PORT: 3000
    volumes:
      - metabase_data:/metabase-data
    depends_on:
      postgres-utilisateur:
        condition: service_healthy
      postgres-sante:
        condition: service_healthy
      postgres-gamification:
        condition: service_healthy
    networks:
      - mspr502-network

  prometheus:
    profiles: [complete]
    image: prom/prometheus:v2.55.1
    container_name: prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - mspr502-network
    restart: unless-stopped

  grafana:
    profiles: [complete]
    image: grafana/grafana:11.4.0
    container_name: grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - mspr502-network
    restart: unless-stopped

networks:
  mspr502-network:
    driver: bridge

volumes:
  pg_utilisateur_data:
  pg_sante_data:
  pg_gamification_data:
  mongo_logs_data:
  mongo_reco_data:
  minio_data:
  metabase_data:
  prometheus_data:
  grafana_data:
